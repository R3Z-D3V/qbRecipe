{{serverEndpoints}}
sv_maxclients {{maxClients}}
set steam_webApiKey "none"
sets tags "qb-core"
sv_licenseKey "{{svLicense}}"
sv_hostname "{{serverName}} built with {{recipeName}} by {{recipeAuthor}}!"
sets sv_projectName "[{{recipeName}}] {{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets locale "en-US" # replace with your language and location code, like en-US, pt-BR, etc
load_server_icon myLogo.png
sv_enforceGameBuild 3258
set mysql_connection_string "{{dbConnectionString}}"
setr qb_locale "en"
setr UseTarget true
set resources_useSystemChat true
exec voice.cfg
exec settings.cfg
exec aceperms.cfg
exec ox.cfg
exec misc.cfg

# When it comes to artifacts its always best to check for the current one without issues here -- https://artifacts.jgscripts.com/

#start by default.
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
stop basic-gamemode
ensure hardcap
ensure baseevents

# QBCore & Extra stuff
ensure ox_lib
ensure qb-core
ensure ox_target
ensure [ox]
ensure [qb]
ensure [standalone]
ensure [libs]
ensure [addon]
ensure [voice]
ensure [assets]

## Permissions ##
add_ace group.admin command allow # allow all commands
{{addPrincipalsMaster}}
